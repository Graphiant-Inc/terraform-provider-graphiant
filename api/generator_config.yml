# Shared description text, referenced below via YAML anchors so the same
# wording isn't repeated at every nesting depth/context it appears in.
# (This top-level key isn't part of the generator's config schema; it's
# dropped on parse and exists purely to hold anchors.)
x_descriptions:
  d_permission_field: &d_permission_field
    description: Access level for this permission area (e.g. "none", "read", "write").
  port_range:
    lower: &d_port_lower
      description: Lower bound of the port range (inclusive).
    upper: &d_port_upper
      description: Upper bound of the port range (inclusive).
  route_tag:
    level_zero: &d_route_tag_level_zero
      description: Top-level route tag.
    level_one: &d_route_tag_level_one
      description: Second-level route tag.
    level_two: &d_route_tag_level_two
      description: Third-level route tag.

provider:
  name: graphiant

resources:
  app_list:
    create:
      path: /v1/global/apps/app-lists
      method: POST
    read:
      path: /v1/global/apps/app-lists/{appListId}
      method: GET
    update:
      path: /v1/global/apps/app-lists/{appListId}
      method: PUT
    delete:
      path: /v1/global/apps/app-lists/{appListId}
      method: DELETE
    schema:
      attributes:
        aliases:
          appListId: id
        overrides:
          description:
            description: Free-form description of the app list.
          apps:
            description: Apps included in this app list.
          apps.id:
            description: Identifier of the referenced app.
          apps.type:
            description: Type discriminator for the referenced app (e.g. "custom", "graphiant", "app-list").

  content_filter:
    create:
      path: /v1/global/content-filters
      method: POST
    read:
      path: /v1/global/content-filters/{globalContentFilterId}
      method: GET
    update:
      path: /v1/global/content-filters/{globalContentFilterId}
      method: PUT
    delete:
      path: /v1/global/content-filters/{globalContentFilterId}
      method: DELETE
    schema:
      attributes:
        aliases:
          globalContentFilterId: id
        overrides:
          lan_names:
            description: Names of LAN segments this filter applies to.
          rules:
            description: Domain-category blocking rules.
          rules.domain_category_id:
            description: ID of the domain category whose traffic this rule blocks.
          rules.exception_wildcards:
            description: Domain wildcards exempted from this rule.

  custom_app:
    create:
      path: /v1/global/apps/custom
      method: POST
    read:
      path: /v1/global/apps/custom/{appId}
      method: GET
    update:
      path: /v1/global/apps/custom/{appId}
      method: PUT
    delete:
      path: /v1/global/apps/custom/{appId}
      method: DELETE
    schema:
      attributes:
        aliases:
          appId: id
        overrides:
          description:
            description: Free-form description of the custom app.
          url:
            description: URL or domain this app matches.
          ip_protocol:
            description: IP protocol this app matches (e.g. "tcp", "udp").
          ip_lists:
            description: Named IP lists this app matches.
          ip_prefixes:
            description: IP prefixes (CIDR) this app matches.
          port_ranges:
            description: Port ranges this app matches.
          port_ranges.lower: *d_port_lower
          port_ranges.upper: *d_port_upper

  site_list:
    create:
      path: /v1/global/site-lists
      method: POST
    read:
      path: /v1/global/site-lists/{id}
      method: GET
    update:
      path: /v1/global/site-lists/{id}
      method: PUT
    delete:
      path: /v1/global/site-lists/{id}
      method: DELETE
    schema:
      ignores:
        - status
      attributes:
        overrides:
          description:
            description: Free-form description of the site list.
          entries:
            description: Members of this site list. Each entry is exactly one of site_id or tag.
          entries.site_id:
            description: ID of a single site to include. Mutually exclusive with tag.
          entries.tag:
            description: Hierarchical route-tag reference. Set instead of site_id to target a route tag rather than a single site.
          entries.tag.level_zero: *d_route_tag_level_zero
          entries.tag.level_one: *d_route_tag_level_one
          entries.tag.level_two: *d_route_tag_level_two

  group:
    create:
      path: /v1/groups
      method: PUT
    read:
      path: /v1/groups/{id}
      method: GET
    update:
      path: /v1/groups/{id}
      method: PATCH
    delete:
      path: /v1/groups/{id}
      method: DELETE
    schema:
      ignores:
        - displayName
        - enterprisePermissions
      attributes:
        overrides:
          description:
            description: Group description.
          permissions:
            description: Per-area role permissions.
          permissions.asset_manager: *d_permission_field
          permissions.b2b: *d_permission_field
          permissions.b2b_security_profile_external: *d_permission_field
          permissions.billing_and_invoicing: *d_permission_field
          permissions.compliance: *d_permission_field
          permissions.developer_tools: *d_permission_field
          permissions.gateway: *d_permission_field
          permissions.global_services: *d_permission_field
          permissions.insights: *d_permission_field
          permissions.licensing: *d_permission_field
          permissions.logs: *d_permission_field
          permissions.monitoring_and_troubleshooting: *d_permission_field
          permissions.network_configuration: *d_permission_field
          permissions.order_status: *d_permission_field
          permissions.reports: *d_permission_field
          permissions.safety_and_security: *d_permission_field
          permissions.service_policies: *d_permission_field
          permissions.support: *d_permission_field
          permissions.user_and_tenant_management: *d_permission_field

  site:
    create:
      path: /v1/sites
      method: POST
    read:
      path: /v1/sites/{siteId}
      method: POST
    update:
      path: /v1/sites/{siteId}
      method: POST
    delete:
      path: /v1/sites/{siteId}
      method: DELETE
    schema:
      attributes:
        aliases:
          siteId: id

  user:
    create:
      path: /v1/users
      method: PUT
    read:
      path: /v1/users/{id}
      method: GET
    update:
      path: /v1/users
      method: PUT
    delete:
      path: /v1/users/{id}
      method: DELETE
    schema:
      attributes:
        aliases:
          id: email
      ignores:
        - userId

data_sources:
  app_list:
    read:
      path: /v1/global/apps/app-lists/{appListId}
      method: GET
    schema:
      attributes:
        aliases:
          appListId: id
        overrides:
          name:
            description: App list name.
          description:
            description: Free-form description of the app list.
          apps:
            description: Apps included in this app list.
          apps.id:
            description: Identifier of the referenced app.
          apps.type:
            description: Type discriminator for the referenced app (e.g. "custom", "graphiant", "app-list").

  app_lists:
    read:
      path: /v1/global/apps/app-lists
      method: GET
    schema:
      attributes:
        overrides:
          app_lists:
            description: App lists.
          app_lists.id:
            description: App list identifier.
          app_lists.name:
            description: App list name.
          app_lists.description:
            description: Free-form description of the app list.
          app_lists.app_count:
            description: Number of apps in this app list.
          app_lists.policy_reference_count:
            description: Number of policies referencing this app list.

  content_filter:
    read:
      path: /v1/global/content-filters/{globalContentFilterId}
      method: GET
    schema:
      attributes:
        aliases:
          globalContentFilterId: id
        overrides:
          name:
            description: Content filter name.
          lan_names:
            description: Names of LAN segments this filter applies to.
          rules:
            description: Domain-category blocking rules.
          rules.domain_category_id:
            description: ID of the domain category whose traffic this rule blocks.
          rules.exception_wildcards:
            description: Domain wildcards exempted from this rule.
          site_list_id:
            description: Site list whose members this filter applies to, if not scoped to all sites.
          use_all_sites:
            description: Whether this filter applies to all sites in the tenant.
          created_at:
            description: Creation timestamp (RFC3339, UTC).
          updated_at:
            description: Last update timestamp (RFC3339, UTC).

  content_filters:
    read:
      path: /v1/global/content-filters
      method: GET
    schema:
      attributes:
        overrides:
          content_filters.id:
            description: Content filter identifier.
          content_filters.name:
            description: Content filter name.
          content_filters.lan_names:
            description: Names of LAN segments this filter applies to.
          content_filters.site_names:
            description: Names of sites this filter applies to.
          content_filters.rules:
            description: Domain-category blocking rules.
          content_filters.rules.domain_category:
            description: Name of the domain category whose traffic this rule blocks.
          content_filters.rules.exception_wildcards:
            description: Domain wildcards exempted from this rule.
          content_filters.created_at:
            description: Creation timestamp (RFC3339, UTC).
          content_filters.updated_at:
            description: Last update timestamp (RFC3339, UTC).

  custom_app:
    read:
      path: /v1/global/apps/custom/{appId}
      method: GET
    schema:
      attributes:
        aliases:
          appId: id
        overrides:
          name:
            description: Custom app name.
          description:
            description: Free-form description of the custom app.
          url:
            description: URL or domain this app matches.
          ip_protocol:
            description: IP protocol this app matches (e.g. "tcp", "udp").
          ip_lists:
            description: Named IP lists this app matches.
          ip_prefixes:
            description: IP prefixes (CIDR) this app matches.
          port_ranges:
            description: Port ranges this app matches.
          port_ranges.lower: *d_port_lower
          port_ranges.upper: *d_port_upper
          app_list_reference_count:
            description: Number of app lists referencing this custom app.
          policy_reference_count:
            description: Number of policies referencing this custom app.

  custom_apps:
    read:
      path: /v1/global/apps/custom
      method: GET
    schema:
      attributes:
        overrides:
          custom_apps.name:
            description: Custom app name.
          custom_apps.description:
            description: Free-form description of the custom app.
          custom_apps.url:
            description: URL or domain this app matches.
          custom_apps.ip_protocol:
            description: IP protocol this app matches (e.g. "tcp", "udp").
          custom_apps.ip_lists:
            description: Named IP lists this app matches.
          custom_apps.ip_prefixes:
            description: IP prefixes (CIDR) this app matches.
          custom_apps.port_ranges:
            description: Port ranges this app matches.
          custom_apps.port_ranges.lower: *d_port_lower
          custom_apps.port_ranges.upper: *d_port_upper
          custom_apps.app_list_reference_count:
            description: Number of app lists referencing this custom app.
          custom_apps.policy_reference_count:
            description: Number of policies referencing this custom app.
          custom_apps.id:
            description: Custom app identifier.

  site_list:
    read:
      path: /v1/global/site-lists/{id}
      method: GET
    schema:
      attributes:
        overrides:
          description:
            description: Free-form description of the site list.
          entries:
            description: Members of this site list.
          entries.site_id:
            description: ID of a single site included in this entry, if not a route tag.
          entries.tag.level_zero: *d_route_tag_level_zero
          entries.tag.level_one: *d_route_tag_level_one
          entries.tag.level_two: *d_route_tag_level_two

  site_lists:
    read:
      path: /v1/global/site-lists
      method: GET
    schema:
      ignores:
        # vestigial top-level field on this response, unrelated to the
        # per-site-list "description" nested one level down.
        - description
      attributes:
        overrides:
          entries.id:
            description: Site list identifier.
          entries.name:
            description: Site list name.
          entries.description:
            description: Free-form description of the site list.
          entries.edge_references:
            description: Number of edge devices referencing this site list.
          entries.policy_references:
            description: Number of policies referencing this site list.
          entries.site_list_references:
            description: Number of other site lists referencing this site list.
          entries.created_at:
            description: Creation timestamp (RFC3339, UTC).

  group:
    read:
      path: /v1/groups/{id}
      method: GET
    schema:
      ignores:
        - enterprisePermissions
      attributes:
        overrides:
          description:
            description: Group description.
          group_type:
            description: Group type.
          manages_enterprises:
            description: Whether members of this group can manage sub-enterprises.
          time_window_start:
            description: Unix timestamp for the start of the access time window, if the group is time-restricted.
          time_window_end:
            description: Unix timestamp for the end of the access time window, if the group is time-restricted.
          permissions:
            description: Per-area role permissions.
          permissions.asset_manager: *d_permission_field
          permissions.b2b: *d_permission_field
          permissions.b2b_security_profile_external: *d_permission_field
          permissions.billing_and_invoicing: *d_permission_field
          permissions.compliance: *d_permission_field
          permissions.developer_tools: *d_permission_field
          permissions.gateway: *d_permission_field
          permissions.global_services: *d_permission_field
          permissions.insights: *d_permission_field
          permissions.licensing: *d_permission_field
          permissions.logs: *d_permission_field
          permissions.monitoring_and_troubleshooting: *d_permission_field
          permissions.network_configuration: *d_permission_field
          permissions.order_status: *d_permission_field
          permissions.reports: *d_permission_field
          permissions.safety_and_security: *d_permission_field
          permissions.service_policies: *d_permission_field
          permissions.support: *d_permission_field
          permissions.user_and_tenant_management: *d_permission_field
          enterprise_ids:
            description: Enterprises this group has access to.

  groups:
    read:
      path: /v1/groups
      method: GET
    schema:
      ignores:
        - groups.enterprisePermissions
      attributes:
        overrides:
          groups.description:
            description: Group description.
          groups.group_type:
            description: Group type.
          groups.manages_enterprises:
            description: Whether members of this group can manage sub-enterprises.
          groups.time_window_start:
            description: Unix timestamp for the start of the access time window, if the group is time-restricted.
          groups.time_window_end:
            description: Unix timestamp for the end of the access time window, if the group is time-restricted.
          groups.permissions:
            description: Per-area role permissions.
          groups.permissions.asset_manager: *d_permission_field
          groups.permissions.b2b: *d_permission_field
          groups.permissions.b2b_security_profile_external: *d_permission_field
          groups.permissions.billing_and_invoicing: *d_permission_field
          groups.permissions.compliance: *d_permission_field
          groups.permissions.developer_tools: *d_permission_field
          groups.permissions.gateway: *d_permission_field
          groups.permissions.global_services: *d_permission_field
          groups.permissions.insights: *d_permission_field
          groups.permissions.licensing: *d_permission_field
          groups.permissions.logs: *d_permission_field
          groups.permissions.monitoring_and_troubleshooting: *d_permission_field
          groups.permissions.network_configuration: *d_permission_field
          groups.permissions.order_status: *d_permission_field
          groups.permissions.reports: *d_permission_field
          groups.permissions.safety_and_security: *d_permission_field
          groups.permissions.service_policies: *d_permission_field
          groups.permissions.support: *d_permission_field
          groups.permissions.user_and_tenant_management: *d_permission_field
          groups.enterprise_ids:
            description: Enterprises this group has access to.
          groups.id:
            description: Group identifier.
          groups.name:
            description: Group name.

  site:
    read:
      path: /v1/sites/{siteId}
      method: POST
    schema:
      attributes:
        aliases:
          siteId: id
        overrides:
          name:
            description: Site name.
          notes:
            description: Free-form notes about the site.
          address:
            description: Resolved postal address for the site location.
          edge_count:
            description: Number of edge devices onboarded at this site.
          segment_count:
            description: Number of LAN segments configured at this site.
          policy_reference_count:
            description: Number of policies referencing this site.
          site_list_reference_count:
            description: Number of site lists referencing this site.
          tags:
            description: Tags applied to the site.
          created_at:
            description: Creation timestamp (RFC3339, UTC).
          updated_at:
            description: Last update timestamp (RFC3339, UTC).

  sites:
    read:
      path: /v1/sites
      method: GET
    schema:
      ignores:
        - pageInfo
        # keep this data source's item shape matching the singular
        # graphiant_site data source, which is generated from a synthetic
        # response schema (api/augment_spec.py) that never included these.
        - sites.devices
        - sites.policyTag
      attributes:
        overrides:
          sites.id:
            description: Site identifier.
          sites.name:
            description: Site name.
          sites.notes:
            description: Free-form notes about the site.
          sites.address:
            description: Resolved postal address for the site location.
          sites.edge_count:
            description: Number of edge devices onboarded at this site.
          sites.segment_count:
            description: Number of LAN segments configured at this site.
          sites.policy_reference_count:
            description: Number of policies referencing this site.
          sites.site_list_reference_count:
            description: Number of site lists referencing this site.
          sites.tags:
            description: Tags applied to the site.
          sites.created_at:
            description: Creation timestamp (RFC3339, UTC).
          sites.updated_at:
            description: Last update timestamp (RFC3339, UTC).

  user:
    read:
      path: /v1/users/{id}
      method: GET
    schema:
      attributes:
        aliases:
          id: email
      ignores:
        - userId

  users:
    read:
      path: /v1/users
      method: GET
    schema:
      ignores:
        - users.userId

# device / devices are intentionally NOT generated: the real API schema for
# a device is a ~45-field, deeply-nested object that reuses attribute names
# (e.g. "rules", "bgp") at different nesting depths. tfplugingen-framework
# doesn't scope generated Go type names by ancestor path, so it emits
# colliding duplicate types with different bodies for these -- a known,
# unresolved upstream limitation (see hashicorp/terraform-plugin-codegen-framework
# issues #152/#156/#236), not something fixable via config. Device data
# sources stay hand-written (device_data_source.go / devices_data_source.go).
